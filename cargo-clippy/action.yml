name: 'Cargo Clippy'
description: 'Runs cargo clippy with SARIF output formatting and uploads results to GitHub Code Scanning'
author: 'Thomas Kwashnak'

inputs:
  toolchain:
    description: 'Rust toolchain version to use'
    required: false
    default: 'stable'
  components:
    description: 'Rust toolchain components'
    required: false
    default: 'clippy'
  working-directory:
    description: 'Working directory for cargo commands'
    required: false
    default: '.'
  args:
    description: 'Arguments passed to cargo clippy before --'
    required: false
    default: '--all --no-deps --all-features'
  clippy-args:
    description: 'Arguments passed to clippy after --'
    required: false
    default: '-W clippy::todo'
  upload-sarif:
    description: 'Whether to upload SARIF results to GitHub code scanning'
    required: false
    default: 'true'
  sarif-file:
    description: 'SARIF output filename'
    required: false
    default: 'rust-clippy-results.sarif'

runs:
  using: 'composite'
  steps:
    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}

    - name: Install Components
      uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.49.18
      with:
        tool: sarif-fmt,clippy-sarif

    - name: Run Clippy
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ARGS: ${{ inputs.args }}
        CLIPPY_ARGS: ${{ inputs.clippy-args }}
        SARIF_FILE: ${{ inputs.sarif-file }}
      run: python3 "${{ github.action_path }}/run_clippy.py"
      continue-on-error: true

    - name: Upload Clippy Results
      if: inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v3.28.11
      with:
        sarif_file: ${{ inputs.working-directory }}/${{ inputs.sarif-file }}
        wait-for-processing: true

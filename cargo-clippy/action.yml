name: 'Cargo Clippy'
description: 'Runs cargo clippy with SARIF output formatting and uploads results to GitHub Code Scanning'
author: 'Thomas Kwashnak'

inputs:
  toolchain:
    description: 'Rust toolchain version to use'
    required: false
    default: 'stable'
  components:
    description: 'Rust toolchain components'
    required: false
    default: 'clippy'
  working-directory:
    description: 'Working directory for cargo commands'
    required: false
    default: '.'
  args:
    description: 'Arguments passed to cargo clippy before --'
    required: false
    default: '--all --no-deps --all-features'
  clippy-args:
    description: 'Arguments passed to clippy after --'
    required: false
    default: '-W clippy::todo'
  upload-sarif:
    description: 'Whether to upload SARIF results to GitHub code scanning'
    required: false
    default: 'true'
  sarif-file:
    description: 'SARIF output filename'
    required: false
    default: 'rust-clippy-results.sarif'

runs:
  using: 'composite'
  steps:
    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}

    - name: Install Components
      uses: taiki-e/install-action@v2
      with:
        tool: sarif-fmt,clippy-sarif

    - name: Run Clippy
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        cargo clippy ${{ inputs.args }} --message-format=json -- ${{ inputs.clippy-args }} | sort | uniq | clippy-sarif | tee ${{ inputs.sarif-file }} | sarif-fmt
      continue-on-error: true

    - name: Upload Clippy Results
      if: inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ inputs.working-directory }}/${{ inputs.sarif-file }}
        wait-for-processing: true

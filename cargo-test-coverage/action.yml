name: 'Cargo Test Coverage'
description: 'Runs cargo llvm-cov test, generates LCOV coverage report, uploads artifact, and writes summary'
author: 'Thomas Kwashnak'

inputs:
  toolchain:
    description: 'Rust toolchain version to use'
    required: false
    default: 'stable'
  components:
    description: 'Rust toolchain components'
    required: false
    default: 'llvm-tools'
  working-directory:
    description: 'Working directory for cargo commands'
    required: false
    default: '.'
  packages:
    description: 'Specific workspace package(s) to test (space-separated, e.g. "pkg1 pkg2")'
    required: false
    default: ''
  workspace:
    description: 'Whether to explicitly pass --workspace'
    required: false
    default: 'false'
  all-features:
    description: 'Whether to pass --all-features'
    required: false
    default: 'true'
  features:
    description: 'List of features to enable (e.g. "feat1,feat2")'
    required: false
    default: ''
  no-default-features:
    description: 'Whether to pass --no-default-features'
    required: false
    default: 'false'
  all-targets:
    description: 'Whether to pass --all-targets'
    required: false
    default: 'false'
  no-fail-fast:
    description: 'Whether to pass --no-fail-fast'
    required: false
    default: 'true'
  ignore-filename-regex:
    description: 'Regex pattern of files to ignore in coverage'
    required: false
    default: ''
  args:
    description: 'Additional raw arguments passed to cargo llvm-cov test'
    required: false
    default: ''
  test-args:
    description: 'Arguments passed to the test binary after --'
    required: false
    default: ''
  output-path:
    description: 'LCOV output file path'
    required: false
    default: 'lcov.info'
  upload-artifact:
    description: 'Whether to upload LCOV file as an artifact'
    required: false
    default: 'true'
  artifact-name:
    description: 'Name of the uploaded artifact'
    required: false
    default: 'lcov'
  retention-days:
    description: 'Duration (days) to retain the uploaded artifact'
    required: false
    default: '1'
  summary:
    description: 'Whether to write coverage summary to GitHub step summary'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}

    - name: Install Components
      uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.49.18
      with:
        tool: cargo-llvm-cov

    - name: Run Tests with Coverage
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        CMD=("cargo" "llvm-cov" "test")

        if [ "${{ inputs.all-features }}" = "true" ]; then
          CMD+=("--all-features")
        fi

        if [ "${{ inputs.no-default-features }}" = "true" ]; then
          CMD+=("--no-default-features")
        fi

        if [ -n "${{ inputs.features }}" ]; then
          CMD+=("--features" "${{ inputs.features }}")
        fi

        if [ "${{ inputs.workspace }}" = "true" ]; then
          CMD+=("--workspace")
        fi

        if [ "${{ inputs.all-targets }}" = "true" ]; then
          CMD+=("--all-targets")
        fi

        if [ "${{ inputs.no-fail-fast }}" = "true" ]; then
          CMD+=("--no-fail-fast")
        fi

        if [ -n "${{ inputs.packages }}" ]; then
          for pkg in ${{ inputs.packages }}; do
            CMD+=("--package" "$pkg")
          done
        fi

        if [ -n "${{ inputs.ignore-filename-regex }}" ]; then
          CMD+=("--ignore-filename-regex" "${{ inputs.ignore-filename-regex }}")
        fi

        if [ -n "${{ inputs.args }}" ]; then
          read -ra EXTRA <<< "${{ inputs.args }}"
          CMD+=("${EXTRA[@]}")
        fi

        CMD+=("--lcov" "--output-path" "${{ inputs.output-path }}")

        if [ -n "${{ inputs.test-args }}" ]; then
          CMD+=("--" ${{ inputs.test-args }})
        fi

        echo "Running command: ${CMD[*]}"
        "${CMD[@]}"

    - name: Upload Coverage Artifact
      if: inputs.upload-artifact == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.working-directory }}/${{ inputs.output-path }}
        retention-days: ${{ inputs.retention-days }}

    - name: Format Test Coverages
      if: inputs.summary == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ -f "${{ inputs.output-path }}" ]; then
          awk '/SF:/{p=1; b=$0; next} p{b=b RS $0} /LF:/{f=$2} /LH:/{h=$2} /end_of_record/{if(f!=h) print b; p=0}' FS=: ${{ inputs.output-path }} > lcov_formatted.info
          sed -i "s|$GITHUB_WORKSPACE/||g" lcov_formatted.info
        fi

    - name: Write Coverage to Summary
      if: inputs.summary == 'true'
      uses: livewing/lcov-job-summary@f61677de6678fb6f860c8d1d35c5b4540b64b1d3 # v1.3.0
      with:
        lcov: ${{ inputs.working-directory }}/lcov_formatted.info

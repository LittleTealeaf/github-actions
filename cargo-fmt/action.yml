name: 'Cargo Fmt'
description: 'Runs rustfmt / cargo fmt to verify Rust source code formatting'
author: 'Thomas Kwashnak'

inputs:
  toolchain:
    description: 'Rust toolchain version to use (e.g. stable, nightly)'
    required: false
    default: 'stable'
  working-directory:
    description: 'Working directory where Cargo commands should run'
    required: false
    default: '.'
  args:
    description: 'Arguments to pass to cargo fmt'
    required: false
    default: '--all -- --check'

runs:
  using: 'composite'
  steps:
    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ inputs.toolchain }}
        components: rustfmt

    - name: Run cargo fmt check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: cargo fmt ${{ inputs.args }}

name: 'Cargo Doc Pages'
description: 'Builds Rust documentation, generates redirect index.html and .nojekyll, and deploys to GitHub Pages'
author: 'Thomas Kwashnak'

inputs:
  crate-name:
    description: 'Primary crate name for documentation redirect (default auto-detected from Cargo.toml with - converted to _)'
    required: false
    default: ''
  toolchain:
    description: 'Rust toolchain version to use'
    required: false
    default: 'stable'
  working-directory:
    description: 'Working directory for cargo commands'
    required: false
    default: '.'
  args:
    description: 'Arguments passed to cargo doc'
    required: false
    default: '--no-deps --all-features --workspace'
  deploy:
    description: 'Whether to deploy to GitHub Pages'
    required: false
    default: 'true'

outputs:
  page-url:
    description: 'The URL of the deployed GitHub Pages site'
    value: ${{ steps.deployment.outputs.page_url }}

runs:
  using: 'composite'
  steps:
    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        toolchain: ${{ inputs.toolchain }}

    - name: Build Rust Documentation
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        cargo doc ${{ inputs.args }}

        CRATE_NAME="${{ inputs.crate-name }}"
        if [ -z "$CRATE_NAME" ]; then
          if [ -f "Cargo.toml" ]; then
            CRATE_NAME=$(cargo pkgid 2>/dev/null | cut -d# -f2 | cut -d: -f1 | tr '-' '_')
            if [ -z "$CRATE_NAME" ]; then
              CRATE_NAME=$(awk -F '["'\'']' '/^name[[:space:]]*=/ {print $2; exit}' Cargo.toml | tr '-' '_')
            fi
          fi
        fi

        if [ -n "$CRATE_NAME" ]; then
          echo "Setting up root index redirect to ${CRATE_NAME}/index.html"
          echo "<meta http-equiv=\"refresh\" content=\"0; url=${CRATE_NAME}/index.html\">" > target/doc/index.html
        fi

        touch target/doc/.nojekyll

    - name: Setup Pages
      if: inputs.deploy == 'true'
      uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

    - name: Upload Pages Artifact
      if: inputs.deploy == 'true'
      uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
      with:
        path: ${{ inputs.working-directory }}/target/doc

    - name: Deploy to GitHub Pages
      if: inputs.deploy == 'true'
      id: deployment
      uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

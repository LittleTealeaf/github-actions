name: 'Cargo Doc Pages'
description: 'Builds Rust documentation, generates redirect index.html and .nojekyll, and deploys to GitHub Pages'
author: 'Thomas Kwashnak'

inputs:
  crate-name:
    description: 'Primary crate name for documentation redirect (default auto-detected from Cargo.toml with - converted to _)'
    required: false
    default: ''
  toolchain:
    description: 'Rust toolchain version to use'
    required: false
    default: 'stable'
  working-directory:
    description: 'Working directory for cargo commands'
    required: false
    default: '.'
  args:
    description: 'Arguments passed to cargo doc'
    required: false
    default: '--no-deps --all-features --workspace'
  deploy:
    description: 'Whether to deploy to GitHub Pages'
    required: false
    default: 'true'

outputs:
  page-url:
    description: 'The URL of the deployed GitHub Pages site'
    value: ${{ steps.deployment.outputs.page_url }}

runs:
  using: 'composite'
  steps:
    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      with:
        toolchain: ${{ inputs.toolchain }}

    - name: Build Rust Documentation
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: cargo doc ${{ inputs.args }}

    - name: Setup Documentation Redirect
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CRATE_NAME: ${{ inputs.crate-name }}
      run: python3 "${{ github.action_path }}/setup_docs.py"

    - name: Setup Pages
      if: inputs.deploy == 'true'
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

    - name: Upload Pages Artifact
      if: inputs.deploy == 'true'
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: ${{ inputs.working-directory }}/target/doc

    - name: Deploy to GitHub Pages
      if: inputs.deploy == 'true'
      id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
